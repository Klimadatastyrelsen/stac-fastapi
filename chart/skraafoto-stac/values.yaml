replicaCount: 2

image:
  repository: ghcr.io/klimadatastyrelsen/stac-fastapi
  # tag defaults to .Chart.AppVersion when empty - keeps chart and image in lockstep
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []

# an existing secret holding the two keys below; the chart never creates it
postgres:
  existingSecret: ""
  userKey: POSTGRES_USER
  passwordKey: POSTGRES_PASS
  hostReader: ""
  hostWriter: ""
  port: "5432"
  dbname: ""

# the api reads one schema; the dagster sync owns both tables, this release never creates them
stac:
  schema: skraafoto_stac
  itemTable: images

# caller authentication (oidc bearer tokens), enforced on every route but /_mgmt/ping.
# disabled -> the api is open. the jwks endpoint is fetched lazily, so a cold issuer
# never blocks a rollout. tokens must be EdDSA-signed and carry exp, iat, iss, aud, sub.
auth:
  enabled: false
  issuer: "" # required when enabled; the exact `iss` value, not a discovery url
  audience: "" # required when enabled; value the api requires in `aud`
  jwksUrl: "" # required when enabled
  # opaque api keys from the `?token=` flow. without a url they are rejected and only jwts work.
  # decisions are cached 30s and never past the key's exp, so a revoked key lingers that long
  introspection:
    url: "" # rfc 7662 endpoint; kds-auth answers api keys at /api/keys/introspect
    clientId: "" # required with url; this api's oauth client, which a key must name in `aud`
    existingSecret: "" # required with url; holds this api's oauth client secret
    clientSecretKey: OIDC_INTROSPECTION_CLIENT_SECRET

# peers whose x-forwarded-* headers set the scheme and host in generated stac links.
# "*" trusts every in-cluster pod, only safe behind a networkpolicy
forwardedAllowIps: ""

# only needed when the gateway forwards the path unstripped; links follow x-forwarded-prefix
rootPath: ""

# uvicorn worker processes per pod; two fit the 1gi limit, add throughput with replicaCount
webConcurrency: "2"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

# maxUnavailable (not minAvailable) so a one-replica release stays drainable
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# the selector is filled in per release; ScheduleAnyway keeps a one-node cluster schedulable
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}
tolerations: []
affinity: {}
