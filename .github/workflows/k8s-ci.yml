name: k8s ci

on:
  push:
    branches:
      - k8s/atlas
      - kubernetes
  pull_request:
    branches:
      - k8s/atlas
      - kubernetes

jobs:
  test:
    # 3.8 is gone from the 24.04 tool cache, and 3.8 is what the image ships
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      # one pip invocation so the resolver cannot swap pypi stac-fastapi.* dists in over these
      - name: Install packages
        run: |
          python -m pip install \
            ./stac_fastapi/types[dev] \
            ./stac_fastapi/api[dev] \
            ./stac_fastapi/extensions[dev]

      - name: Test
        run: python -m pytest -svvv
        env:
          ENVIRONMENT: testing

  image:
    runs-on: ubuntu-latest
    steps:
      # a stale submodule pin is the likeliest way to break the image
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
